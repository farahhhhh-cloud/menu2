name: Build Flutter APK

on:
  push:
    branches:
      - master
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Fix Android Gradle versions
        run: |
          sed -i 's/com.android.application") version "9.1.0"/com.android.application") version "9.1.1"/' android/settings.gradle
          sed -i 's/gradle-9.3.1-bin.zip/gradle-9.5.0-bin.zip/' android/gradle/wrapper/gradle-wrapper.properties

      - name: Get dependencies
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: menu-makanan-apk
          path: build/app/outputs/flutter-apk/app-release.apk
